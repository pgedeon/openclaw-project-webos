---
layout: default
---

<div class="docs-search">
  <h1>Search the docs</h1>
  <p>
    Client-side search across every published documentation page — titles,
    sections, and page excerpts. Nothing leaves your browser; results are
    matched from <code>docs/search-index.json</code>, regenerated by
    <code>scripts/build-docs-index.mjs</code> whenever docs change.
  </p>

  <input
    id="docs-search-input"
    type="search"
    placeholder="Type to search… (try “snapshot”)"
    autocomplete="off"
    spellcheck="false"
    aria-label="Search the documentation"
  />
  <p id="docs-search-status" class="docs-search-status" role="status" aria-live="polite"></p>
  <ul id="docs-search-results" class="docs-search-results"></ul>

  <noscript>
    <p><strong>Search needs JavaScript.</strong> Browse all pages from the
    <a href="/">documentation index</a> instead.</p>
  </noscript>
</div>

<style>
  .docs-search input[type="search"] {
    width: 100%;
    box-sizing: border-box;
    padding: 0.6rem 0.9rem;
    font-size: 1rem;
    color: #159957;
    background: #fff;
    border: 1px solid #cdd7dd;
    border-radius: 0.3rem;
    outline: none;
  }
  .docs-search input[type="search"]:focus {
    border-color: #159957;
    box-shadow: 0 0 0 3px rgba(21, 153, 87, 0.15);
  }
  .docs-search-status { color: #606c71; font-size: 0.9rem; min-height: 1.3em; }
  .docs-search-results { list-style: none; margin: 0; padding: 0; }
  .docs-search-results li {
    padding: 0.8rem 0;
    border-bottom: 1px solid #e6ebef;
  }
  .docs-search-results a {
    font-weight: 600;
    font-size: 1.05rem;
  }
  .docs-search-section {
    display: inline-block;
    margin-left: 0.5rem;
    padding: 0.1rem 0.5rem;
    font-size: 0.72rem;
    font-weight: 400;
    color: #606c71;
    background: #f3f6f9;
    border: 1px solid #dde5ea;
    border-radius: 999px;
    vertical-align: middle;
  }
  .docs-search-excerpt {
    margin: 0.3rem 0 0;
    color: #606c71;
    font-size: 0.9rem;
  }
</style>

<script>
(function () {
  'use strict';

  var input = document.getElementById('docs-search-input');
  var statusEl = document.getElementById('docs-search-status');
  var listEl = document.getElementById('docs-search-results');
  var entries = [];
  // Relative first (works when served straight out of docs/), then the
  // site-absolute path used by GitHub Pages project sites.
  var INDEX_URLS = [
    'search-index.json',
    '../search-index.json',
    '/openclaw-project-webos/search-index.json'
  ];

  function load(i) {
    if (i >= INDEX_URLS.length) {
      statusEl.textContent = 'Could not load search-index.json.';
      return;
    }
    fetch(INDEX_URLS[i])
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!Array.isArray(data)) throw new Error('unexpected index shape');
        entries = data;
        statusEl.textContent = '';
        run();
        input.focus();
      })
      .catch(function () { load(i + 1); });
  }

  function score(entry, q) {
    var s = 0;
    if (entry.title.toLowerCase().indexOf(q) !== -1) s += 4;
    if (entry.excerpt.toLowerCase().indexOf(q) !== -1) s += 2;
    if (entry.section.toLowerCase().indexOf(q) !== -1) s += 1;
    return s;
  }

  function render(query, hits) {
    listEl.textContent = '';
    statusEl.textContent = hits.length
      ? hits.length + (hits.length === 1 ? ' result' : ' results') + ' for "' + query + '"'
      : 'No results for "' + query + '".';
    hits.forEach(function (entry) {
      var li = document.createElement('li');
      var link = document.createElement('a');
      link.href = entry.url;
      link.textContent = entry.title;
      var badge = document.createElement('span');
      badge.className = 'docs-search-section';
      badge.textContent = entry.section;
      var excerpt = document.createElement('p');
      excerpt.className = 'docs-search-excerpt';
      excerpt.textContent = entry.excerpt;
      li.appendChild(link);
      li.appendChild(badge);
      li.appendChild(excerpt);
      listEl.appendChild(li);
    });
  }

  function run() {
    var query = input.value.trim().toLowerCase();
    if (!query) {
      listEl.textContent = '';
      statusEl.textContent = entries.length
        ? 'Type to search ' + entries.length + ' pages.'
        : 'Loading search index…';
      return;
    }
    var hits = entries
      .map(function (entry) { return { entry: entry, score: score(entry, query) }; })
      .filter(function (hit) { return hit.score > 0; })
      .sort(function (a, b) {
        return b.score - a.score || a.entry.title.localeCompare(b.entry.title);
      })
      .map(function (hit) { return hit.entry; });
    render(input.value.trim(), hits);
  }

  input.addEventListener('input', run);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { load(0); });
  } else {
    load(0);
  }
})();
</script>
