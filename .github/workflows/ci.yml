name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check (node --check over root, routes/, storage/, scripts/, src/)
        run: |
          set -euo pipefail
          files=$(
            {
              find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \)
              find routes storage scripts src -type f \( -name '*.js' -o -name '*.mjs' \)
            } | sort
          )
          count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)
          echo "Checking $count files..."
          printf '%s\n' "$files" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            node --check "$f"
          done
          echo "Syntax OK: $count files"

      - name: Docs drift check (DB-free)
        run: node scripts/docs-drift-check.js

      - name: DB-free tests
        run: node scripts/ci-db-free-tests.js
