#     test-asana-json-snapshot.js, test-dispatcher-v2-integration.js,
#     test-filter-behavior.js (Playwright + server on :3876),
#     test-metrics-api.js, test-metrics-snapshot-job.js, test-org-bootstrap-coverage.js,
#     test-saved-views-api.js (requires CLI arg), test-settings-deep.js (needs .env + DB),
#     test-task-server-storage-fallback.js, test-workflow-runs-business-context.js
#   - Reference files missing from the repo (stale view/page tests):
#     test-agents-page-blockers.js, test-agents-page-explicit-grouping.js,
#     test-approvals-view.js, test-artifacts-view.js, test-audit-view-governance.js,
#     test-dashboard-navigation.js, test-departments-view.js,
#     test-extracted-views-registry.js, test-local-dev-service-worker.js,
#     test-metrics-view.js, test-operations-page.js, test-publish-view.js,
#     test-runbook-governance-embeds.js, test-service-requests-view.js,
#     test-skills-tools-entrypoint.js, test-skills-tools-page.js,
#     test-skills-tools-view.js, test-view-router.js, test-workflows-page.js
#   - Require .env not present in CI:
#     test-batch1-work.js, test-batch3-admin.js

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check (node --check over root, routes/, storage/, scripts/, src/)
        run: |
          set -euo pipefail
          files=$(
            {
              find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \)
              find routes storage scripts src -type f \( -name '*.js' -o -name '*.mjs' \)
            } | sort
          )
          count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)
          echo "Checking $count files..."
          printf '%s\n' "$files" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            node --check "$f"
          done
          echo "Syntax OK: $count files"

      - name: Docs drift check (DB-free)
        run: node scripts/docs-drift-check.js

      - name: DB-free tests
        run: node scripts/ci-db-free-tests.js
